[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "inceptis"
version = "0.4.0"
description = "GPU prediction, training, and sequence design for IncepTIS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.10.7",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "psutil==7.0.0",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "seaborn==0.13.2",
  "torch==2.8.0",
  "tqdm==4.67.1",
  "transformers==4.57.3",
  "timm==1.0.22",
]

[project.optional-dependencies]
demo = [
  "ipykernel==6.30.1",
  "matplotlib==3.10.7",
  "nbconvert==7.16.6",
]

[project.scripts]
inceptis-evolve = "inceptis_evolve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["inceptis_predict", "inceptis_evolve"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
